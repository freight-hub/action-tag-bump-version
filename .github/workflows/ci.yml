name: CI Pipeline
on: [push]

jobs:

  verify-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: corepack enable

    - run: yarn
    - run: yarn run build

    - run: git diff --exit-code
      name: Check for uncommitted build
